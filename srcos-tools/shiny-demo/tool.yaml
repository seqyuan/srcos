schemaVersion: 1
id: shiny-demo
version: 0.1.0
name: "Shiny Demo"
description: "最小的 R Shiny 应用：一个滑块 + 直方图，演示 kind: service 的完整生命周期（端口、探活、路由、空闲回收）"

kind: service                # 长驻单元：跑着，直到被停或空闲回收
backend: local
sandbox: bwrap

# 声明式启动命令（argv，不经 shell）。替代了原来那个只为了「找 R、读端口、
# exec」的 work.sh：${...} 由 SRCOS 从本单元自己的环境展开，值就是环境里的那些，
# 所以命令与环境不会对不上。端口用 ${SRCOS_PORT}（端口池分配的，代理按它转发）。
command:
  - "R"
  - "--vanilla"
  - "-e"
  - "shiny::runApp('${SRCOS_WORKSPACE}', host='127.0.0.1', port=${SRCOS_PORT}, launch.browser=FALSE)"

# 解释器来自**具名环境**：宿主路径（R 装在哪儿）写在 config/environments.yaml，
# 不再写进工具包 —— 这样工具包换一台机器不用改。环境的 root 只读挂进沙箱，
# 且按宿主路径本身挂（解释器内部用绝对路径），PATH/LANG 也由它提供。
environment: r-miniforge

interface:
  inputs:
    - name: title
      type: string
      label: "标题"
      description: "显示在页面顶部的标题（等价于 app.R 里的默认值）"
      default: "SRCOS Shiny Demo"

resources:
  cpu: 1
  memory: "2Gi"

ingress:
  port: 8080
  healthcheck:
    path: "/"                 # Shiny 的首页
    timeout: "60s"
    startup_grace: "180s"     # 首次启动 R 要加载一堆包

lifecycle:
  restart: on-failure
  max_lifetime: "12h"
  idle_ttl: "1h"              # 一小时没人访问就回收

# 首次使用时把模板拷进用户的 workspace；之后用户可以自己改 app.R。
workspace:
  init_from: workspace-template/

# 托管 agent 的实例身份（ADR-025）。应用本不是一个 agent，但声明后 SRCOS
# 会在实例启动时签发一枚实例凭据（scope 与白名单来自这里）放到
# $HOME/.srcos/agent-token，app.R 用它调 SRCOS 自己的 API（SRCOS_API）。
# 这类调用在审计里记为「这个实例做的」（actor 带 instance）。
#
# read：页面上显示它能看到什么（工具目录）。
# submit + tools：可以**提交**任务，但只能提交 hello-fanout —— 白名单只能从
# 所有者（这个实例的 user）可见的工具里收窄，所以凭据是所有者权限的子集。
agent:
  mcp: [read, submit]
  tools: [hello-fanout]
