<style>
  .adm-wrap { max-width: 1180px; margin: 0 auto; padding: 20px var(--pad-x) 64px; }
  .adm-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
  .adm-title { font-size: 20px; font-weight: 650; letter-spacing: -0.01em; }
  .adm-sub { color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }
  .adm-actions { display: flex; gap: 8px; align-items: center; }
  .adm-start { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 14px; }
  .adm-start select {
    height: 34px; padding: 0 10px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--card, transparent); color: var(--text); font-size: 13px;
  }
  .adm-start .adm-hint-inline { color: var(--text-muted); font-size: 12px; }
  .adm-btn {
    height: 38px; padding: 0 16px; border-radius: var(--r-pill); border: 1px solid var(--border);
    background: transparent; color: var(--text); font-size: 13px; font-weight: 550; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
    transition: background 0.15s var(--ease-out-quart);
  }
  .adm-btn:hover { background: var(--hover); text-decoration: none; }
  .adm-btn.primary { background: var(--accent); border-color: transparent; color: #fff; }
  .adm-btn.primary:hover { background: var(--accent-hover); }
  .adm-btn.danger { color: var(--danger, #d33); border-color: color-mix(in srgb, var(--danger, #d33) 35%, transparent); }
  .adm-btn.sm { height: 30px; padding: 0 12px; font-size: 12px; }

  .adm-section { margin-top: 34px; }
  .adm-section h2 { font-size: 15px; font-weight: 650; margin: 0 0 4px; }
  .adm-section .hint { color: var(--text-muted); font-size: 12.5px; margin-bottom: 12px; }

  .adm-card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--r-lg);
    overflow: hidden; box-shadow: var(--sh-card);
  }
  table.adm { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.adm th {
    text-align: left; font-weight: 600; color: var(--text-muted); font-size: 11.5px;
    text-transform: uppercase; letter-spacing: 0.04em; padding: 10px 14px; border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  table.adm td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
  table.adm tr:last-child td { border-bottom: none; }
  table.adm tr:hover td { background: var(--hover); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .tag {
    display: inline-block; padding: 2px 8px; border-radius: var(--r-pill); font-size: 11.5px; font-weight: 600;
    border: 1px solid var(--border); color: var(--text-muted);
  }
  .tag.ok { color: #1a7f37; border-color: color-mix(in srgb, #1a7f37 35%, transparent); background: color-mix(in srgb, #1a7f37 10%, transparent); }
  .tag.warn { color: #9a6700; border-color: color-mix(in srgb, #9a6700 35%, transparent); background: color-mix(in srgb, #9a6700 10%, transparent); }
  .tag.bad { color: var(--danger, #d33); border-color: color-mix(in srgb, var(--danger, #d33) 35%, transparent); background: color-mix(in srgb, var(--danger, #d33) 10%, transparent); }
  .muted { color: var(--text-muted); }
  .right { text-align: right; }
  .adm-empty { padding: 22px 14px; color: var(--text-muted); font-size: 13px; }
  .adm-note { color: var(--text-muted); font-size: 12px; }

  /* inline grant editor */
  details.grant { margin-top: 6px; }
  details.grant > summary { cursor: pointer; color: var(--accent); font-size: 12.5px; }
  .grant-form { display: grid; gap: 8px; margin-top: 10px; max-width: 420px; }
  .grant-form label { font-size: 12px; color: var(--text-muted); }
  .grant-form input[type=text], .grant-form input[type=number] {
    width: 100%; height: 34px; padding: 0 10px; border-radius: var(--r-md);
    border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 13px;
  }
  .grant-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .grant-check { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text); }
  .adm-toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--card); border: 1px solid var(--border); border-radius: var(--r-pill);
    padding: 10px 18px; font-size: 13px; box-shadow: var(--sh-lift); opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
  }
  .adm-toast.show { opacity: 1; }
  .adm-toast.bad { color: var(--danger, #d33); border-color: color-mix(in srgb, var(--danger, #d33) 45%, transparent); }
  .logs-pre {
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--r-md); padding: 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 1.45;
    max-height: 280px; overflow: auto; white-space: pre-wrap; word-break: break-all; margin-top: 8px;
  }
</style>
<div class="adm-wrap">
  <div class="adm-head">
    <div>
      <div class="adm-title">管理控制台</div>
      <div class="adm-sub">
        以 <strong>%s</strong> 身份 · 实例总览 / 强制停止 / 授权管理（与 <span class="mono">srcos grant</span>、
        <span class="mono">srcos svc stop</span> 是同一套操作）
      </div>
    </div>
    <div class="adm-actions">
      <button type="button" class="adm-btn" id="adm-refresh" onclick="location.reload()">刷新</button>
      <a class="adm-btn" href="/admin/audit">审计流</a>
      <a class="adm-btn" href="/">仪表盘</a>
      <button type="button" class="adm-btn" id="theme-toggle" onclick="toggleTheme()">🌙</button>
    </div>
  </div>

  <div class="adm-section">
    <h2>实例（全部用户）</h2>
    <div class="hint">只显示「还活着」的实例的资源占用快照（后端能报才有）；日志可展开，强制停止不需要实例所有者确认。</div>
    <div class="adm-card">%s</div>
    <div class="adm-card">%s</div>
  </div>

  <div class="adm-section">
    <h2>工具与授权</h2>
    <div class="hint">
      默认拒绝：未被任何 grant 提到的工具，只有管理员能用。授权改动立即生效（运行中的网关不再需要重启）。
      %s
    </div>
    <div class="adm-card">%s</div>
  </div>

  <div class="adm-section">
    <h2>用户与组</h2>
    <div class="hint">组是授权的最小单位；管理员是唯一可以修改这一切的人。</div>
    <div class="adm-card">%s</div>
  </div>
</div>
<div class="adm-toast" id="adm-toast"></div>
